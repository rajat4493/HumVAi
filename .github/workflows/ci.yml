name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run verify:subpath
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
  # Real Firefox and WebKit (Safari's engine, including an iPhone profile). Not installable in the coding sandbox, so this is the
  # only place those engines run. Reported separately so a browser-specific failure is visible without hiding the main result.
  cross-browser:
    runs-on: ubuntu-latest
    needs: check
    continue-on-error: true
    timeout-minutes: 30
    # Playwright's own image carries Firefox, WebKit and every system library at the exact pinned version (keep the tag equal to
    # @playwright/test in package.json). Installing them with apt on the stock runner took 55 minutes through a slow Ubuntu mirror.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: CROSS_BROWSER=1 npx playwright test --project=firefox --project=webkit --project=webkit-phone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-results
          path: test-results
